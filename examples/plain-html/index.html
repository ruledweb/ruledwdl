<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>@ruledwdl/core v0.3.0 — Plain HTML Example</title>
  <!--
    No build step. The browser resolves bare specifier `@ruledwdl/core` via this
    import map pointing directly at src/index.js.
    100% Zero-Dependency Core in v0.3.0 — no external markdown runtime required.
  -->
  <script type="importmap">
  {
    "imports": {
      "@ruledwdl/core": "../../src/index.js"
    }
  }
  </script>
  <style>
    body { font-family: ui-monospace, monospace; padding: 40px; background: #f4f4f5; }
    iframe { width: 100%; height: 420px; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; }
  </style>
</head>
<body>
  <h1>@ruledwdl/core v0.3.0 (Zero-Dependency Engine)</h1>
  <p>composePage() ran entirely in the browser — no server, no build step, 100% zero external dependencies.</p>

  <iframe id="out" title="WDL render output"></iframe>

  <script type="module">
    import { composePage, createMemoryStore, WDLDomTree } from '@ruledwdl/core';

    // In-memory store with Schema v2.0 component and layout definitions
    const store = createMemoryStore({
      layouts: {
        base: {
          $version: '2.0',
          name: 'base',
          COMPONENTS: [{
            $version: '2.0',
            layers: 'div.shell',
            attr: { '.shell': { text: '{{content}}' } },
          }],
          DATA: {
            $version: '2.0',
            __design_tokens: ':root{--color-primary:#4f46e5;}',
          },
        },
      },
      components: {
        badge: {
          $version: '2.0',
          layers: 'span.badge',
          attr: { '.badge': { text: '${label}' } },
        },
      },
    });

    const page = {
      $version: '0.3.0',
      title: 'Hello from the browser',
      layout: 'base',
      REGISTRY: {
        $version: '2.0',
        shell: { style: 'font-family:system-ui;padding:32px;' },
        badge: { style: 'display:inline-block;background:var(--color-primary);color:#fff;padding:4px 10px;border-radius:999px;font-size:12px;' },
        card:  { style: 'margin-top:12px;' },
      },
      COMPONENTS: [
        { $version: '2.0', component: 'badge', data_overrides: { label: '@ruledwdl/core@0.3.0' } },
        {
          $version: '2.0',
          // Space-free flat string array format (Zero indent whitespace burden)
          layers: [
            "div.card",
            "> h1.title",
            "+ p.subtitle"
          ],
          attr: {
            '.title':    { text: 'Hello ${name} 👋' },
            '.subtitle': { text: 'This ran with zero build step — 100% zero-dependency WDL Core v0.3.0.' },
          }
        },
      ],
      DATA: { $version: '2.0', name: 'World' },
    };

    const { html, versions } = await composePage(store, 'demo', page);
    console.log('Schema versions metadata:', versions);
    document.getElementById('out').srcdoc = html;
  </script>
</body>
</html>
